[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smeta-screen"
version = "0.1.0"
description = "One-shot title/abstract screening: criteria + records + API key → ranked include lists"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "openai>=1.0.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "pyyaml>=6.0",
    "tqdm>=4.66.0",
    "requests>=2.31.0",
]

[project.scripts]
smeta-screen = "smeta_screen.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["smeta_screen*"]

[tool.setuptools.package-data]
smeta_screen = ["templates/*"]
